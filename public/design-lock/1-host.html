<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pásala · Dirección 1 · Marcador</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens-draft.css">
<style>
  /* Direction 1 · Marcador: a TV scoreboard. Sharp corners, hairlines, a broadcast lower third. */
  :root { --radius: 2px; }
  body { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: 28px 40px 22px; gap: 22px; }
  header { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .brand { font: 800 30px/1 var(--font-display); letter-spacing: -0.02em; }
  .brand span { color: var(--hot); }
  .meta { display: flex; gap: 36px; font-size: 20px; color: var(--text-muted); }
  .meta b { color: var(--text); font-family: var(--font-mono); font-weight: 700; margin-left: 8px; }

  main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 44px; min-height: 0; }
  .stage { display: grid; grid-template-rows: auto auto auto 1fr; min-width: 0; }
  .label { font-size: 20px; color: var(--text-muted); margin: 0 0 6px; }
  .holder { font: 800 150px/0.95 var(--font-display); letter-spacing: -0.035em; color: var(--hot); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .money-row { display: flex; align-items: center; gap: 28px; margin-top: 26px; }
  .amount { font: 800 104px/1 var(--font-mono); color: var(--gold); letter-spacing: -0.04em; }
  .ring { --size: 124px; width: var(--size); height: var(--size); border-radius: 50%; display: grid; place-items: center; position: relative; flex: none; }
  .ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--hot) calc(var(--progress) * 1turn), var(--line) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 12px), black calc(100% - 11px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 12px), black calc(100% - 11px)); }
  .ring b { font: 800 44px/1 var(--font-mono); }
  .lower-third { align-self: end; display: grid; grid-template-columns: 8px 1fr; background: var(--surface); border-radius: var(--radius); }
  .lower-third::before { content: ''; background: var(--ok); }
  .lower-third[data-ok="false"]::before { background: var(--err); }
  .lower-third p { margin: 0; padding: 16px 22px; font-size: 24px; line-height: 1.25; }

  aside { display: grid; grid-template-rows: auto auto 1fr; gap: 16px; min-height: 0; border-left: 1px solid var(--line); padding-left: 32px; }
  .moved { font: 800 60px/1 var(--font-mono); color: var(--gold); letter-spacing: -0.03em; }
  .theory { margin: 10px 0 0; font-size: 19px; color: var(--text-muted); }
  .theory b { color: var(--text); font-family: var(--font-mono); }
  .meter { height: 4px; background: var(--line); margin-top: 12px; }
  .meter i { display: block; height: 100%; width: calc(var(--moved-ratio) * 100%); background: var(--gold); }
  .chain { list-style: none; margin: 0; padding: 0; display: grid; align-content: start; }
  .chain li { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 14px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 18px; }
  .chain li:last-child { border-bottom: 0; }
  .chain .n { color: var(--text-muted); font-family: var(--font-mono); font-size: 15px; }
  .chain .in { font-family: var(--font-mono); color: var(--text-muted); }
  .chain .sv { font-family: var(--font-mono); font-weight: 700; color: var(--ok); min-width: 92px; text-align: right; }
  .chain li[data-ok="false"] .sv { color: var(--err); text-decoration: line-through; }

  footer { display: grid; grid-template-columns: auto repeat(5, 1fr); gap: 0; align-items: stretch; border-top: 1px solid var(--line); padding-top: 14px; }
  footer > span { font-size: 18px; color: var(--text-muted); padding-right: 24px; align-self: center; }
  .rank { list-style: none; margin: 0; padding: 0; display: contents; }
  .rank li { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; padding: 0 18px; border-left: 1px solid var(--line); }
  .rank .pos { font: 800 30px/1 var(--font-display); color: var(--text-muted); grid-row: span 2; align-self: center; }
  .rank li:first-child .pos { color: var(--gold); }
  .rank .nm { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .sv { font: 700 20px var(--font-mono); color: var(--gold); }

  @media (prefers-reduced-motion: no-preference) {
    .holder { animation: pulse 1.2s var(--ease) infinite; transform-origin: left center; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.025); } }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Pás<span>a</span>la</div>
    <div class="meta"><span>Sala<b>KFTR</b></span><span>PMC<b data-demo="pmc"></b></span><span>Pase<b data-demo="turn"></b></span></div>
  </header>
  <main>
    <section class="stage">
      <p class="label">Tiene el dinero</p>
      <h1 class="holder" data-demo="holder"></h1>
      <div class="money-row">
        <div class="amount" data-demo="amount"></div>
        <div class="ring" role="timer" aria-label="Segundos restantes"><b data-demo="seconds"></b></div>
      </div>
      <div class="lower-third" data-demo-event-state><p data-demo="event"></p></div>
    </section>
    <aside>
      <div>
        <p class="label">Dinero que se ha movido</p>
        <div class="moved" data-demo="moved"></div>
        <p class="theory">La teoría dice <b data-demo="theory"></b> (k = <span data-demo="k"></span>)</p>
        <div class="meter"><i></i></div>
      </div>
      <p class="label" style="margin:6px 0 0">Últimos pases</p>
      <ol class="chain" data-list="chain"></ol>
    </aside>
  </main>
  <footer>
    <span>Ahorro</span>
    <ol class="rank" data-list="ranking"></ol>
  </footer>
  <template id="chain-row"><li><span class="n" data-f="n"></span><span data-f="name"></span><span class="in" data-f="income"></span><span class="sv" data-f="saving"></span></li></template>
  <template id="rank-row"><li><span class="pos" data-f="pos"></span><span class="nm" data-f="name"></span><span class="sv" data-f="saved"></span></li></template>
  <div class="demo-label">Datos de ejemplo</div>
  <script src="demo.js"></script>
</body>
</html>
