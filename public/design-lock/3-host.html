<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pásala · Dirección 3 · Cadena</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens-draft.css">
<style>
  /* Direction 3 · Cadena: the chain itself is the hero. Each pass is a node sized by its income, so the series visibly dies out. Pill shapes. */
  :root { --radius: 999px; }
  body { min-height: 100dvh; display: grid; grid-template-rows: auto auto 1fr; padding: 26px 44px 28px; gap: 10px; }
  header { display: flex; align-items: baseline; gap: 22px; }
  .brand { font: 800 28px/1 var(--font-display); letter-spacing: -0.02em; }
  .meta { margin-left: auto; font: 500 18px var(--font-mono); color: var(--text-muted); }

  .track { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(9, 1fr); align-items: end; position: relative; height: 196px; }
  .track::before { content: ''; position: absolute; left: 5%; right: 5%; bottom: 108px; height: 2px; background: var(--line); }
  .track li { display: grid; justify-items: center; align-content: end; gap: 8px; position: relative; }
  .node { --d: calc(30px + var(--share) * 58px); width: var(--d); height: var(--d); border-radius: 50%; background: var(--gold); margin-bottom: calc(108px - var(--d) / 2 + 1px); }
  .track li[data-ok="false"] .node { background: var(--bg); box-shadow: inset 0 0 0 3px var(--err); }
  .track .nm, .track .in { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .track .nm { bottom: 46px; font-size: 16px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .track .in { bottom: 20px; font: 600 15px var(--font-mono); color: var(--text-muted); }
  .track .sv { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font: 500 13px var(--font-mono); color: var(--ok); }
  .track li[data-ok="false"] .sv { color: var(--err); text-decoration: line-through; }
  .track .now .node { --d: 44px; background: var(--hot); }
  .track .now .nm { color: var(--hot); font-weight: 700; }

  main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px; align-items: start; margin-top: 30px; }
  .holder-block { display: grid; grid-template-columns: auto 1fr; column-gap: 28px; align-items: center; }
  .ring { --size: 176px; grid-row: span 3; width: var(--size); height: var(--size); border-radius: 50%; display: grid; place-items: center; position: relative; }
  .ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--hot) calc(var(--progress) * 1turn), var(--surface-2) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 16px), black calc(100% - 15px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 16px), black calc(100% - 15px)); }
  .ring b { font: 800 56px/1 var(--font-mono); }
  .holder { font: 800 108px/0.95 var(--font-display); letter-spacing: -0.035em; margin: 0; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amount { font: 800 78px/1.05 var(--font-mono); color: var(--gold); letter-spacing: -0.03em; }
  .event { grid-column: 1 / -1; margin: 22px 0 0; padding: 14px 24px; border-radius: var(--radius); background: var(--surface); font-size: 22px; display: flex; gap: 12px; align-items: center; }
  .event::before { content: ''; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); }
  .event[data-ok="false"]::before { background: var(--err); }

  .totals { display: grid; gap: 4px; }
  .label { font-size: 19px; color: var(--text-muted); margin: 0; }
  .moved { font: 800 64px/1 var(--font-mono); color: var(--gold); letter-spacing: -0.03em; }
  .converge { position: relative; height: 14px; border-radius: var(--radius); background: var(--surface); margin: 14px 0 6px; overflow: hidden; }
  .converge i { position: absolute; inset: 0 auto 0 0; width: calc(var(--moved-ratio) * 100%); border-radius: var(--radius); background: var(--gold); }
  .theory { display: flex; justify-content: space-between; font-size: 18px; color: var(--text-muted); }
  .theory b { font-family: var(--font-mono); color: var(--text); }
  .rank { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .rank li { display: flex; gap: 10px; align-items: baseline; padding: 8px 16px; border-radius: var(--radius); background: var(--surface); font-size: 17px; }
  .rank li:first-child { background: var(--gold); color: var(--on-hot); }
  .rank .pos { font: 700 15px var(--font-mono); opacity: .75; }
  .rank .sv { font: 700 17px var(--font-mono); }

  @media (prefers-reduced-motion: no-preference) {
    .track .now .node { animation: beat 1s var(--ease) infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.18); } }
  }
</style>
</head>
<body>
  <header><div class="brand">Pásala</div><span class="meta">Sala KFTR · PMC <span data-demo="pmc"></span></span></header>
  <ol class="track" data-list="chain"></ol>
  <main>
    <section class="holder-block">
      <div class="ring" role="timer" aria-label="Segundos restantes"><b data-demo="seconds"></b></div>
      <p class="label">Tiene el dinero</p>
      <h1 class="holder" data-demo="holder"></h1>
      <div class="amount" data-demo="amount"></div>
      <p class="event" data-demo-event-state><span data-demo="event"></span></p>
    </section>
    <section>
      <div class="totals">
        <p class="label">Dinero que se ha movido en <span data-demo="passes"></span> pases</p>
        <div class="moved" data-demo="moved"></div>
        <div class="converge"><i></i></div>
        <div class="theory"><span>$0</span><span>Teoría k × ΔI <b data-demo="theory"></b></span></div>
      </div>
      <ol class="rank" data-list="ranking"></ol>
    </section>
  </main>
  <template id="chain-row"><li><span class="node"></span><span class="nm" data-f="name"></span><span class="in" data-f="income"></span><span class="sv" data-f="saving"></span></li></template>
  <template id="rank-row"><li><span class="pos" data-f="pos"></span><span data-f="name"></span><span class="sv" data-f="saved"></span></li></template>
  <div class="demo-label">Datos de ejemplo</div>
  <script src="demo.js"></script>
  <script>
    // The holder is the live end of the chain.
    document.addEventListener('DOMContentLoaded', function () {
      var t = document.querySelector('[data-list="chain"]'), d = window.DEMO;
      var li = document.createElement('li'); li.className = 'now';
      var node = document.createElement('span'); node.className = 'node';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = d.holder;
      var inc = document.createElement('span'); inc.className = 'in'; inc.textContent = d.money(d.amount);
      li.append(node, nm, inc); t.appendChild(li);
    });
  </script>
</body>
</html>
